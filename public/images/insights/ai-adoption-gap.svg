<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Bar chart: 88% of businesses use AI, but only about 25% report significant value from it.">
  <defs>
    <radialGradient id="glow" cx="86%" cy="20%" r="62%">
      <stop offset="0%" stop-color="#2f3ee0" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#2333c9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="valueBar" x1="0" y1="640" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7f92ff"/>
      <stop offset="100%" stop-color="#3e5cff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0a0a0b"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- title -->
  <text x="140" y="116" fill="#7f92ff" font-size="30" font-weight="700" letter-spacing="3">THE ADOPTION–VALUE GAP</text>
  <text x="140" y="158" fill="#b4b4b0" font-size="25">Share of organisations, 2026</text>

  <!-- gridlines + y-axis labels (0–100%) -->
  <g>
    <line x1="240" y1="780" x2="1420" y2="780" stroke="#ffffff" stroke-opacity="0.16"/>
    <line x1="240" y1="640" x2="1420" y2="640" stroke="#ffffff" stroke-opacity="0.06"/>
    <line x1="240" y1="500" x2="1420" y2="500" stroke="#ffffff" stroke-opacity="0.06"/>
    <line x1="240" y1="360" x2="1420" y2="360" stroke="#ffffff" stroke-opacity="0.06"/>
    <line x1="240" y1="220" x2="1420" y2="220" stroke="#ffffff" stroke-opacity="0.06"/>
  </g>
  <g fill="#71717a" font-size="22" text-anchor="end">
    <text x="210" y="788">0</text>
    <text x="210" y="648">25%</text>
    <text x="210" y="508">50%</text>
    <text x="210" y="368">75%</text>
    <text x="210" y="228">100%</text>
  </g>

  <!-- bar 1: using AI (88%) -->
  <rect x="440" y="287" width="220" height="493" rx="6" fill="#2f3ee0"/>
  <text x="550" y="252" fill="#f4f4f2" font-size="52" font-weight="700" text-anchor="middle">88%</text>
  <text x="550" y="828" fill="#d0d0ce" font-size="27" text-anchor="middle">Using AI</text>

  <!-- bar 2: getting significant value (~25%) -->
  <rect x="1000" y="640" width="220" height="140" rx="6" fill="url(#valueBar)"/>
  <text x="1110" y="605" fill="#f4f4f2" font-size="52" font-weight="700" text-anchor="middle">~25%</text>
  <text x="1110" y="828" fill="#d0d0ce" font-size="27" text-anchor="middle">Getting real value</text>

  <!-- gap annotation between the two bar tops -->
  <g stroke="#7f92ff" stroke-opacity="0.7" stroke-dasharray="7 8">
    <line x1="660" y1="287" x2="835" y2="287"/>
    <line x1="835" y1="287" x2="835" y2="640"/>
    <line x1="835" y1="640" x2="1000" y2="640"/>
  </g>
  <text x="820" y="470" fill="#9aa6ff" font-size="24" font-weight="600" text-anchor="end">the gap</text>

  <!-- source -->
  <text x="140" y="872" fill="#6a6a70" font-size="21">Sources: McKinsey, State of AI; BCG, Closing the AI Impact Gap</text>
</svg>
